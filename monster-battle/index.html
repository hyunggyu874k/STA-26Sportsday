<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>몬스터 대전 시뮬레이션</title>
<style>
  html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;aspect-ratio:16/9}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="render.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const seed = +(q.get('seed') || 6);
  Sim.init(document.getElementById('c'), seed);
  if (!q.has('capture')) {
    let n = 0, last = 0;
    const loop = t => {
      if (t - last >= 1000 / Sim.FPS) { last = t; Sim.drawFrame(n); n = (n + 1) % Sim.total; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
